# macOS local model runner configuration.
#
# The GitHub runner automatically gets self-hosted, macOS, and architecture
# labels. These custom labels are the routing contract for this repo's macOS
# local model workflow.

# Leave RUNNER_NAME empty to derive a stable name from the Mac hostname.
: "${RUNNER_VERSION:=2.329.0}"
: "${RUNNER_NAME:=}"
: "${RUNNER_LABELS:=macos-local,local-model}"
: "${RUNNER_DIR:=}"
: "${INSTALL_RUNNER_SERVICE:=0}"
