# Linux gh-aw runner wired to a Mac-hosted Qwen/Ollama endpoint.

: "${RUNNER_VERSION:=2.335.1}"
: "${RUNNER_USER:=actions}"
: "${RUNNER_NAME:=}"
: "${RUNNER_LABELS:=local-macrunner-qwenollama,gh-aw}"
: "${RUNNER_DIR:=/opt/actions-runner-local-macrunner-qwenollama}"
: "${INSTALL_RUNNER_SERVICE:=1}"
: "${INSTALL_PACKAGES:=1}"
: "${SET_GITHUB_VARIABLES:=1}"
: "${LOCAL_AGENT_MODEL:=qwen2.5:0.5b}"
: "${LOCAL_AGENT_MODEL_ALIAS:=qwen2.5-0.5b}"
: "${OLLAMA_PROXY_LISTEN:=127.0.0.1:11435}"
: "${OLLAMA_UPSTREAM_BASE_URL:=}"
