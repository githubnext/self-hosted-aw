# Azure runner VM configuration.
#
# This file is shell syntax. The default-assignment form keeps the file useful in
# GitHub Actions, where workflow env or matrix values can override these values.

: "${AZURE_SUBSCRIPTION_ID:=41035778-206b-4ce2-9ec4-07987c6a7e06}"
: "${AZURE_RESOURCE_GROUP:=gh-aw-demo-runners}"
: "${AZURE_LOCATION:=eastus}"
: "${AZURE_VM_NAME:=gh-aw-azure-runner-01}"
: "${AZURE_VM_SIZE:=Standard_B2ms}"
: "${AZURE_ZONE:=}"
: "${AZURE_USE_ZONES:=0}"
: "${AZURE_ADMIN_USER:=azureuser}"

# The helper tries the preferred location/size first, then walks these fallback
# candidates when Azure reports capacity or subscription SKU restrictions.
: "${AZURE_FALLBACK_LOCATIONS=eastus2 centralus southcentralus westus2}"
: "${AZURE_FALLBACK_VM_SIZES=Standard_D2s_v5 Standard_D2as_v5 Standard_B2s}"
: "${AZURE_FALLBACK_ZONES=}"

: "${RUNNER_VERSION:=2.329.0}"
: "${RUNNER_NAME:=${AZURE_VM_NAME}}"
