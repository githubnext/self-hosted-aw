# Azure runner VM configuration.
#
# This file is shell syntax. The default-assignment form keeps the file useful in
# GitHub Actions, where workflow env or matrix values can override these values.

: "${AZURE_SUBSCRIPTION_ID:=}"
: "${AZURE_RESOURCE_GROUP:=gh-aw-demo-runners}"
: "${AZURE_LOCATION:=eastus}"
: "${AZURE_VM_NAME:=gh-aw-azure-runner-01}"
: "${AZURE_VM_SIZE:=Standard_B2ms}"
: "${AZURE_ZONE:=}"
: "${AZURE_ADMIN_USER:=azureuser}"

: "${RUNNER_VERSION:=2.329.0}"
: "${RUNNER_NAME:=${AZURE_VM_NAME}}"
