name: Runner Capability Smoke

on:
  workflow_dispatch:
    inputs:
      target:
        description: Runner lane to check
        required: true
        default: azure
        type: choice
        options:
          - azure
          - cloudflare
          - all

permissions:
  contents: read

jobs:
  azure:
    name: Azure self-hosted runner
    if: ${{ inputs.target == 'azure' || inputs.target == 'all' }}
    runs-on: [self-hosted, linux, x64, azure]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check gh-aw runner prerequisites
        run: bash scripts/check-gh-aw-runner.sh
      - name: Smoke test OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_SITE_URL: ${{ vars.OPENROUTER_SITE_URL }}
          OPENROUTER_APP_NAME: ${{ vars.OPENROUTER_APP_NAME }}
        run: bash scripts/smoke-openrouter.sh

  cloudflare:
    name: Cloudflare self-hosted runner lane
    if: ${{ inputs.target == 'cloudflare' || inputs.target == 'all' }}
    runs-on: [self-hosted, linux, x64, cloudflare]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check gh-aw runner prerequisites
        run: bash scripts/check-gh-aw-runner.sh
      - name: Smoke test OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_SITE_URL: ${{ vars.OPENROUTER_SITE_URL }}
          OPENROUTER_APP_NAME: ${{ vars.OPENROUTER_APP_NAME }}
        run: bash scripts/smoke-openrouter.sh
