name: macOS Local Model Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: macOS self-hosted local model runner
    runs-on: [self-hosted, macOS, macos-local, local-model]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check macOS local runner
        run: bash scripts/check-macos-local-runner.sh
      - name: Smoke test local OpenAI-compatible model
        env:
          LOCAL_OPENAI_BASE_URL: ${{ vars.LOCAL_OPENAI_BASE_URL || 'http://127.0.0.1:11434/v1' }}
          LOCAL_OPENAI_MODEL: ${{ vars.LOCAL_OPENAI_MODEL || 'qwen2.5:0.5b' }}
          LOCAL_OPENAI_API_KEY: ${{ secrets.LOCAL_OPENAI_API_KEY }}
        run: bash scripts/smoke-local-openai-compatible.sh
